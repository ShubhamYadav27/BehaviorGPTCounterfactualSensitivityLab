[project]
name = "behaviorgpt-counterfactual-lab"
version = "0.1.0"
description = "BehaviorGPT Counterfactual Sensitivity Lab: Systematic empirical analysis of single-action behavioral interventions."
requires-python = ">=3.11"
dependencies = [
    "behaviorgpt",
    "fastapi>=0.110.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -v"
